[package]
edition      = "2024"
name         = "ptt-switch-firmware"
rust-version = "1.88"
version      = "0.1.0"
description  = "CH572D firmware for the ptt-switch: capacitive touch on a wire, reported over BLE"

[lib]
name = "ptt_fw"
path = "src/lib.rs"

[[bin]]
name  = "ptt-switch"
path  = "src/main.rs"
test  = false
bench = false

[dependencies]

[profile.dev]
# The firmware is always built with --release (mise run build); this only
# keeps an accidental debug build small enough to link.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = true
opt-level     = "s"
