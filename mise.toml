[tools]
pixi = "0.66.0"
# Flashes the CH572D through a WCH-LinkE on J4; CH570/CH572 support
# arrived in 0.1.3.
"cargo:wlink" = "0.1.3"

[tasks.test]
description = "Check the CH572D symbol and footprint against the datasheet, the netlist against the intended circuit, the enclosure geometry, the firmware logic, and the app's protocol code against the firmware's"
depends = ["box:test", "fw:test"]
run = "pixi run pytest -q --tb=short tests"

[tasks.erc]
description = "Run KiCad ERC on a copy of the schematic (kicad-cli can rewrite what it reads); report in build/erc.rpt"
run = [
    "rm -rf build/erc && mkdir -p build/erc",
    "cp -r ptt-switch/. build/erc/",
    "kicad-cli sch erc --severity-all --exit-code-violations -o build/erc.rpt build/erc/ptt-switch.kicad_sch",
]

# FreeCAD is not installed by mise. FREECAD (GUI) and FREECADCMD (headless,
# may be several words, e.g. "FreeCAD.AppImage freecadcmd") default to the
# commands on PATH; set them in mise.local.toml where FreeCAD lives elsewhere.

[tasks."box:build"]
description = "Build the enclosure from enclosure/params.toml into enclosure/build (FCStd, STEP, STL)"
run = "${FREECADCMD:-freecadcmd} enclosure/build.py"

[tasks."box:test"]
description = "Run the enclosure geometry tests under FreeCAD's Python"
run = "${FREECADCMD:-freecadcmd} enclosure/test_box.py"

[tasks."box:open"]
description = "Build the enclosure, then open it in the FreeCAD GUI"
depends = ["box:build"]
run = "setsid -f ${FREECAD:-freecad} enclosure/build/ptt-box.FCStd >/dev/null 2>&1"

# Firmware (firmware/, Rust for the CH572D).  WCH's closed-source BLE and
# ISP libraries are downloaded, not committed.

[tasks."fw:wch"]
description = "Download WCH's closed-source CH572 BLE and ISP libraries into firmware/wch/ (pinned EVT commit, SHA-256 checked)"
dir = "firmware"
run = '''
base=https://raw.githubusercontent.com/openwch/ch570/1e34c9450cd6df390153952c097cd09dd8a91aed/EVT/EXAM
mkdir -p wch
fetch() {
    out="wch/$(basename "$1")"
    if [ -f "$out" ] && echo "$2  $out" | sha256sum -c --quiet - 2>/dev/null; then
        return
    fi
    curl -fsSL -o "$out.part" "$base/$1"
    echo "$2  $out.part" | sha256sum -c --quiet -
    mv "$out.part" "$out"
}
fetch BLE/LIB/libCH572BLE_PERI.a 36b6a9acd5f21c4994d6051c8767e77c3509bd633bbee66b323ee701e8bb7ae5
fetch SRC/StdPeriphDriver/libISP572.a e6b1ab4402c69aba3f11de97fef0cf7b9d4e01394edac853085c7078fde26a5a
'''

[tasks."fw:build"]
description = "Build the firmware (release) without flashing"
depends = ["fw:wch"]
dir = "firmware"
run = "cargo build --release"

[tasks."fw:flash"]
description = "Build the firmware and flash it through a WCH-LinkE on J4 (within 5 s of power-up, see NOTES.md)"
depends = ["fw:wch"]
dir = "firmware"
run = "cargo run --release"

[tasks."fw:test"]
description = "Run the firmware's host tests: touch detection, sleep timing, BLE payloads"
dir = "firmware"
run = 'cargo test -q --lib --target "$(rustc -vV | sed -n "s/^host: //p")"'

# Android app (android/): plain Java built by android/build.sh with the SDK's
# command-line tools, no Gradle. Needs ANDROID_HOME (else $HOME/Android) with
# build-tools 34.0.0 and platform android-33, and a JDK.

[tasks."app:build"]
description = "Build the Android app, android/build/ptt-switch.apk"
run = "android/build.sh"

[tasks."app:install"]
description = "Build the Android app, install it on the phone attached over adb and start it"
depends = ["app:build"]
run = [
    "adb install -r android/build/ptt-switch.apk",
    "adb shell am start -n pttswitch.app/.MainActivity",
]
